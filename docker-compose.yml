services:
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    # Loads apps/api/.env — a real, git-ignored file the operator creates
    # locally (copy apps/api/.env.example to apps/api/.env and fill in
    # real values). NEVER point this at .env.example: that file only
    # documents which variables exist and intentionally contains no real
    # values, so using it as the runtime source would silently start the
    # API with every credential empty.
    env_file:
      - ./apps/api/.env

